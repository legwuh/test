<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>gaanaspot</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0e18;
    --surface:#171a28;
    --surface-2:#1f2333;
    --border:rgba(255,255,255,0.08);
    --border-strong:rgba(255,255,255,0.16);
    --text:#eef0f6;
    --muted:#8b90a6;
    --muted-2:#5d6178;
    --gold:#f2c94c;
    --gold-dim:#765f20;
    --mint:#4fe0a5;
    --coral:#ff6f6f;
    --track:#2a2e3f;
  }
  *{box-sizing:border-box}
  html,body{min-height:100%}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:52px 20px 72px;
  }
  button,input{font:inherit}
  .wrap{width:100%;max-width:620px}

  header.top{
    text-align:center;
    margin-bottom:34px;
  }
  h1{
    margin:0;
    font-family:'Space Grotesk',sans-serif;
    font-size:42px;
    line-height:1;
    font-weight:700;
    letter-spacing:-0.035em;
  }
  h1 .gaana{color:var(--gold)}
  h1 .spot{color:#fff}

  .state{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:220px;
    gap:14px;
    color:var(--muted);
    text-align:center;
    font-size:14px;
  }
  .spinner{
    width:26px;height:26px;border-radius:50%;
    border:2.5px solid var(--border-strong);
    border-top-color:var(--gold);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .song-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:20px;
    padding:34px 28px 30px;
    box-shadow:0 18px 50px rgba(0,0,0,.16);
  }
  .progress-wrap{position:relative;padding-top:6px;padding-bottom:28px}
  .progress-track{
    position:relative;
    width:100%;
    height:9px;
    background:var(--track);
    border-radius:4px;
    overflow:hidden;
    cursor:pointer;
  }
  .progress-fill{
    position:absolute;
    left:0;top:0;bottom:0;
    width:100%;
    background:var(--gold);
    border-radius:0;
    transform:scaleX(0);
    transform-origin:left center;
    will-change:transform;
    pointer-events:none;
  }
  .progress-cut{
    position:absolute;
    top:0;
    bottom:0;
    width:2px;
    transform:translateX(-50%);
    background:var(--surface);
    z-index:2;
    pointer-events:none;
  }
  .progress-label-layer{
    position:absolute;
    left:0;
    right:0;
    top:0;
    height:34px;
    pointer-events:none;
  }
  .progress-label-marker{
    position:absolute;
    top:29px;
    display:none;
  }
  .progress-label-marker.active{display:block}
  .marker-label{
    position:relative;
    left:0;
    display:block;
    transform:translateX(-50%);
    font-family:'Roboto Mono',monospace;
    font-size:11px;
    line-height:1;
    color:var(--gold);
    white-space:nowrap;
  }
  .progress-label-marker.active .marker-label::before{
    content:"";
    position:absolute;
    left:50%;
    top:-7px;
    transform:translateX(-50%);
    border-left:4px solid transparent;
    border-right:4px solid transparent;
    border-bottom:5px solid var(--gold);
  }

  .play-area{
    display:flex;
    justify-content:center;
    margin:45px 0 24px;
  }
  .play-btn{
    width:72px;
    height:72px;
    border:0;
    border-radius:50%;
    background:var(--gold);
    color:#181306;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:none;
    transition:transform .15s ease;
  }
  .play-btn:hover{transform:scale(1.05)}
  .play-btn:active{transform:scale(.98)}
  .play-btn:disabled{opacity:.45;cursor:default;transform:none}
  .play-btn svg{width:28px;height:28px}

  .volume-row{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:9px;
    color:var(--muted-2);
  }
  .volume-row input[type=range]{
    width:140px;
    height:4px;
    appearance:none;
    -webkit-appearance:none;
    background:var(--track);
    border-radius:999px;
    accent-color:var(--gold);
    cursor:pointer;
  }
  .volume-row input[type=range]::-webkit-slider-thumb{
    appearance:none;
    -webkit-appearance:none;
    width:13px;height:13px;border-radius:50%;background:var(--gold);
  }
  .volume-row input[type=range]::-moz-range-thumb{
    width:13px;height:13px;border:0;border-radius:50%;background:var(--gold);
  }

  form.guess-form{
    position:relative;
    margin-top:22px;
  }
  .guess-input-row{
    display:flex;
    gap:10px;
  }
  input[type=text]{
    flex:1;
    min-width:0;
    height:50px;
    padding:0 16px;
    border-radius:12px;
    border:1px solid var(--border-strong);
    background:rgba(23,26,40,.52);
    color:var(--text);
    outline:none;
  }
  input[type=text]::placeholder{color:var(--muted-2)}
  input[type=text]:focus{border-color:var(--gold)}
  input[type=text]:disabled{opacity:.45}
  button.submit{
    min-width:108px;
    height:50px;
    padding:0 18px;
    border-radius:12px;
    border:1px solid var(--border-strong);
    background:var(--surface-2);
    color:var(--text);
    font-weight:700;
    cursor:pointer;
  }
  button.submit:hover:not(:disabled){border-color:var(--gold)}
  button.submit.skip-mode{color:var(--muted)}
  button.submit:disabled{opacity:.45;cursor:default}

  .suggestions{
    position:absolute;
    z-index:20;
    left:0;right:118px;
    top:58px;
    max-height:240px;
    overflow-y:auto;
    background:var(--surface-2);
    border:1px solid var(--border-strong);
    border-radius:12px;
    box-shadow:0 16px 30px rgba(0,0,0,.35);
  }
  .suggestions button{
    display:block;
    width:100%;
    border:0;
    background:transparent;
    color:var(--text);
    text-align:left;
    padding:11px 14px;
    cursor:pointer;
  }
  .suggestions button:hover,.suggestions button.active{background:rgba(242,201,76,.09)}
  .suggestions .title{font-size:13px;font-weight:600}
  .suggestions .artist{margin-top:2px;color:var(--muted);font-size:12px}

  footer{
    margin-top:20px;
    text-align:center;
    color:var(--muted-2);
    font-size:12px;
  }

  .modal-backdrop{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    padding:22px;
    background:rgba(5,7,13,.78);
    backdrop-filter:blur(8px);
  }
  .modal-backdrop.show{display:flex}
  .result-modal{
    position:relative;
    width:min(430px,100%);
    background:var(--surface);
    border:1px solid var(--border-strong);
    border-radius:24px;
    padding:24px;
    text-align:center;
    box-shadow:0 28px 80px rgba(0,0,0,.45);
  }
  .result-art{
    width:220px;
    height:220px;
    margin:0 auto 20px;
    display:block;
    object-fit:cover;
    border-radius:10px;
    background:var(--surface-2);
    box-shadow:none;
  }
  .result-kicker{
    margin:0 0 6px;
    font-family:Arial,Helvetica,sans-serif;
    font-size:13px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.08em;
  }
  .result-kicker.won{color:#43d17b}
  .result-kicker.failed{color:#ef5350}
  .modal-close{
    position:absolute;
    top:8px;
    right:10px;
    width:40px;
    height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:0;
    border-radius:0;
    background:transparent;
    color:#fff;
    font-size:30px;
    font-weight:700;
    line-height:1;
    cursor:pointer;
    text-shadow:0 1px 8px rgba(0,0,0,.55);
  }
  .modal-close:hover{color:var(--gold)}
  .result-title{
    margin:0;
    font-family:'Space Grotesk',sans-serif;
    font-size:24px;
    line-height:1.18;
  }
  .result-artist{
    margin:6px 0 22px;
    color:var(--muted);
    font-size:14px;
  }
  .result-actions{
    display:grid;
    gap:10px;
  }
  .apple-music-btn{
    width:100%;
    height:48px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    border:1px solid var(--border-strong);
    border-radius:12px;
    background:transparent;
    color:var(--text);
    font-weight:700;
    box-sizing:border-box;
  }
  .apple-music-btn:hover{
    border-color:var(--gold);
  }
  .next-btn{
    width:100%;
    height:48px;
    border:0;
    border-radius:12px;
    background:var(--gold);
    color:#181306;
    font-weight:800;
    cursor:pointer;
  }

  @media (max-width:600px){
    body{padding:34px 14px 56px}
    h1{font-size:36px}
    .song-card{padding:28px 18px 26px}
    .guess-input-row{gap:8px}
    button.submit{min-width:96px;padding:0 14px}
    .suggestions{right:104px}
  }
  @media (prefers-reduced-motion:reduce){.spinner{animation:none}.play-btn{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1><span class="gaana">gaana</span><span class="spot">spot</span></h1>
  </header>

  <div id="loadingState" class="state">
    <div class="spinner"></div>
    <div>Loading songs...</div>
  </div>

  <div id="errorState" class="state" style="display:none;">
    <div>Couldn't reach the chart or preview service.</div>
    <button class="next-btn" id="retryBtn" type="button" style="max-width:180px;">Try again</button>
  </div>

  <div id="game" style="display:none;">
    <section class="song-card" aria-label="Song preview">
      <div class="progress-wrap">
        <div class="progress-track" id="progressTrack" aria-label="Song preview progress">
          <div class="progress-fill" id="progressFill"></div>
          <div class="progress-cut" data-second="0.1"></div>
          <div class="progress-cut" data-second="0.5"></div>
          <div class="progress-cut" data-second="2"></div>
          <div class="progress-cut" data-second="8"></div>
          <div class="progress-cut" data-second="15"></div>
        </div>
        <div class="progress-label-layer" aria-hidden="true">
          <div class="progress-label-marker" data-second="0.1"><span class="marker-label">0.1s</span></div>
          <div class="progress-label-marker" data-second="0.5"><span class="marker-label">0.5s</span></div>
          <div class="progress-label-marker" data-second="2"><span class="marker-label">2s</span></div>
          <div class="progress-label-marker" data-second="8"><span class="marker-label">8s</span></div>
          <div class="progress-label-marker" data-second="15"><span class="marker-label">15s</span></div>
        </div>
      </div>

      <div class="play-area">
        <button class="play-btn" id="playBtn" type="button" aria-label="Play snippet">
          <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
      </div>

      <div class="volume-row">
        <svg viewBox="0 0 24 24" fill="none" width="17" height="17" aria-hidden="true">
          <path d="M4.5 9.5v5h3.5l4.5 3.7V5.8L8 9.5H4.5z" fill="currentColor"/>
          <path d="M15.5 8.1a5 5 0 0 1 0 7.8M18 5.6a8.4 8.4 0 0 1 0 12.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1" aria-label="Volume">
      </div>
    </section>

    <form class="guess-form" id="guessForm" autocomplete="off">
      <div class="guess-input-row">
        <input type="text" id="guessInput" placeholder="Name that song" autocomplete="off" aria-label="Song guess">
        <button class="submit skip-mode" type="submit" id="submitBtn">Skip</button>
      </div>
      <div class="suggestions" id="suggestions" style="display:none;"></div>
    </form>
  </div>

  <footer>made by z</footer>
</div>

<div class="modal-backdrop" id="resultModal" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
  <div class="result-modal">
    <button class="modal-close" id="modalClose" type="button" aria-label="Close result">×</button>
    <img class="result-art" id="resultArt" alt="">
    <p class="result-kicker failed" id="resultKicker">IT WAS</p>
    <h2 class="result-title" id="resultTitle"></h2>
    <p class="result-artist" id="resultArtist"></p>
    <div class="result-actions">
      <button class="next-btn" id="nextBtn" type="button">Next song</button>
      <a class="apple-music-btn" id="appleMusicBtn" href="#" target="_blank" rel="noopener noreferrer">Listen on Apple Music</a>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  const CHART_URL = "/api/chart";
  const LOOKUP_URL = "/api/lookup?ids=";
  const DURATIONS = [0.1, 0.5, 2, 8, 15];
  const PREVIEW_LENGTH = 15;
  const VERY_POPULAR_COUNT = 100;

  const el = id => document.getElementById(id);
  const loadingState = el("loadingState");
  const errorState = el("errorState");
  const gameEl = el("game");
  const progressTrackEl = el("progressTrack");
  const progressFillEl = el("progressFill");
  const volumeSlider = el("volumeSlider");
  const playBtn = el("playBtn");
  const playIcon = el("playIcon");
  const guessForm = el("guessForm");
  const guessInput = el("guessInput");
  const submitBtn = el("submitBtn");
  const suggestionsEl = el("suggestions");
  const resultModal = el("resultModal");
  const resultArt = el("resultArt");
  const resultTitle = el("resultTitle");
  const resultArtist = el("resultArtist");
  const resultKicker = el("resultKicker");
  const appleMusicBtn = el("appleMusicBtn");
  const nextBtn = el("nextBtn");
  const modalClose = el("modalClose");
  const retryBtn = el("retryBtn");
  const markers = Array.from(document.querySelectorAll(".progress-label-marker"));
  const cuts = Array.from(document.querySelectorAll(".progress-cut"));
  [...markers, ...cuts].forEach(marker => {
    const seconds = Number(marker.dataset.second);
    marker.style.left = ((seconds / PREVIEW_LENGTH) * 100) + "%";
  });

  let pool = [];
  let recentIds = [];
  let current = null;
  let levelIndex = 0;
  let over = false;
  let audio = null;
  let currentVolume = 1;
  let activeSuggestionIndex = -1;
  let playbackRun = 0;
  let playbackMode = "idle";
  let clipTarget = 0;
  let clipFrame = 0;
  let answerFrame = 0;

  function normalize(s){
    return (s || "")
      .toLowerCase()
      .replace(/\(.*?\)|\[.*?\]/g, " ")
      .replace(/feat\.?\s.*$/i, " ")
      .replace(/[^a-z0-9]+/g, " ")
      .trim();
  }

  function isCorrectGuess(guess, song){
    const g = normalize(guess);
    const title = normalize(song.name);
    if (!g || !title) return false;
    if (g === title) return true;
    return title.length > 3 && (g.includes(title) || title.includes(g));
  }

  async function fetchJSON(url){
    const res = await fetch(url);
    if (!res.ok) throw new Error("bad response " + res.status);
    return res.json();
  }

  async function loadPool(){
    const chart = await fetchJSON(CHART_URL);
    const entries = ((chart.feed && chart.feed.results) || []).slice(0, VERY_POPULAR_COUNT);
    const ids = entries.map(e => e.id).filter(Boolean);
    const chunks = [];
    for (let i = 0; i < ids.length; i += 20) chunks.push(ids.slice(i, i + 20));

    const lookups = [];
    for (const chunk of chunks){
      const data = await fetchJSON(LOOKUP_URL + chunk.join(","));
      if (data && data.results) lookups.push(...data.results);
    }

    const seen = new Set();
    return lookups.filter(t => t.previewUrl && t.trackName && t.artistName).filter(t => {
      const key = normalize(t.trackName) + "|" + normalize(t.artistName);
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    }).map(t => ({
      id: t.trackId,
      name: t.trackName,
      artist: t.artistName,
      preview: t.previewUrl,
      art: (t.artworkUrl100 || "").replace("100x100", "600x600"),
      link: t.trackViewUrl || "#"
    }));
  }

  function setActiveMarker(){
    markers.forEach((marker, index) => marker.classList.toggle("active", index === levelIndex));
  }

  function setProgress(seconds){
    const clamped = Math.max(0, Math.min(PREVIEW_LENGTH, seconds));
    progressFillEl.style.transform = "scaleX(" + (clamped / PREVIEW_LENGTH) + ")";
  }

  function setPlayIcon(playing){
    playIcon.innerHTML = playing
      ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>'
      : '<path d="M8 5v14l11-7z"/>';
    playBtn.setAttribute("aria-label", playing ? "Pause snippet" : "Play snippet");
  }

  function resetPlaybackUI(){
    setProgress(0);
    setPlayIcon(false);
  }

  function cancelPlaybackFrames(){
    if (clipFrame){
      cancelAnimationFrame(clipFrame);
      clipFrame = 0;
    }
    if (answerFrame){
      cancelAnimationFrame(answerFrame);
      answerFrame = 0;
    }
  }

  function stopAudio(reset=true){
    playbackRun++;
    cancelPlaybackFrames();
    playbackMode = "idle";
    if (audio){
      audio.pause();
      if (reset) audio.currentTime = 0;
      audio.loop = false;
    }
    setPlayIcon(false);
    if (reset) setProgress(0);
  }

  function finishClip(target){
    cancelPlaybackFrames();
    if (audio){
      audio.pause();
      audio.currentTime = target;
    }
    setProgress(target);
    playbackMode = "idle";
    setPlayIcon(false);
  }

  function playClipToLevel(startAt=0){
    if (!audio || over) return;
    const run = ++playbackRun;
    const target = DURATIONS[levelIndex];
    clipTarget = target;
    cancelPlaybackFrames();
    playbackMode = "clip";
    audio.loop = false;
    const safeStart = Math.max(0, Math.min(startAt, target));
    audio.currentTime = safeStart;
    setProgress(safeStart);
    setPlayIcon(true);

    const tick = () => {
      if (run !== playbackRun || !audio) return;
      const now = Number.isFinite(audio.currentTime) ? audio.currentTime : safeStart;
      setProgress(Math.min(now, target));
      if (now >= target - 0.005 || audio.ended){
        finishClip(target);
        return;
      }
      clipFrame = requestAnimationFrame(tick);
    };
    clipFrame = requestAnimationFrame(tick);
    audio.play().catch(() => {
      if (run !== playbackRun) return;
      cancelPlaybackFrames();
      playbackMode = "idle";
      setPlayIcon(false);
    });
  }

  function toggleClipPlayback(){
    if (!audio) return;
    if (over){
      if (playbackMode === "answer") toggleAnswerPlayback();
      return;
    }
    if (!audio.paused && playbackMode === "clip") {
      playbackRun++;
      cancelPlaybackFrames();
      audio.pause();
      setPlayIcon(false);
      return;
    }
    if (audio.paused && playbackMode === "clip" && audio.currentTime > 0 && audio.currentTime < clipTarget - 0.005){
      playClipToLevel(audio.currentTime);
      return;
    }
    playClipToLevel(0);
  }

  function playAnswerUntilNext(restart=false){
    if (!audio) return;
    const run = ++playbackRun;
    cancelPlaybackFrames();
    playbackMode = "answer";
    audio.loop = true;
    if (restart) audio.currentTime = 0;
    const tick = () => {
      if (run !== playbackRun || !audio || playbackMode !== "answer") return;
      const duration = Math.min(audio.duration || PREVIEW_LENGTH, PREVIEW_LENGTH);
      if (duration > 0) setProgress(Math.min(audio.currentTime, duration));
      answerFrame = requestAnimationFrame(tick);
    };
    answerFrame = requestAnimationFrame(tick);
    setPlayIcon(!audio.paused);
    audio.play().catch(() => {
      if (run === playbackRun) setPlayIcon(false);
    });
  }

  function toggleAnswerPlayback(){
    if (!audio || playbackMode !== "answer") return;
    if (!audio.paused){
      playbackRun++;
      if (answerFrame){
        cancelAnimationFrame(answerFrame);
        answerFrame = 0;
      }
      audio.pause();
      setPlayIcon(false);
      return;
    }
    playAnswerUntilNext(false);
  }

  function pickNextSong(){
    let candidates = pool.filter(song => !recentIds.includes(song.id));
    if (!candidates.length){ recentIds = []; candidates = pool; }
    const song = candidates[Math.floor(Math.random() * candidates.length)];
    recentIds.push(song.id);
    if (recentIds.length > Math.min(15, Math.floor(pool.length / 2))) recentIds.shift();
    return song;
  }

  function updateSubmitMode(){
    const hasText = guessInput.value.trim().length > 0;
    submitBtn.textContent = hasText ? "Guess" : "Skip";
    submitBtn.classList.toggle("skip-mode", !hasText);
  }

  function resetSuggestions(){
    suggestionsEl.innerHTML = "";
    suggestionsEl.style.display = "none";
    activeSuggestionIndex = -1;
  }

  function startRound(){
    over = false;
    levelIndex = 0;
    current = pickNextSong();
    resultModal.classList.remove("show");
    cancelPlaybackFrames();
    playbackMode = "idle";

    if (audio){
      audio.pause();
      audio.src = "";
      audio = null;
    }
    audio = new Audio(current.preview);
    audio.preload = "auto";
    audio.volume = currentVolume;

    guessInput.disabled = false;
    guessInput.value = "";
    submitBtn.disabled = false;
    submitBtn.classList.remove("modal-closed-mode");
    updateSubmitMode();
    resetSuggestions();
    setActiveMarker();
    resetPlaybackUI();
    guessInput.focus();
  }

  function openResultModal(won){
    over = true;
    resultKicker.textContent = won ? "(YOU GOT)" : "IT WAS";
    resultKicker.classList.toggle("won", won);
    resultKicker.classList.toggle("failed", !won);
    resultTitle.textContent = current.name;
    resultArtist.textContent = current.artist;
    resultArt.src = current.art;
    resultArt.alt = current.name + " album cover";
    appleMusicBtn.href = current.link || "#";
    appleMusicBtn.setAttribute("aria-disabled", current.link ? "false" : "true");
    resultModal.classList.add("show");
    guessInput.disabled = true;
    submitBtn.disabled = true;
    resetSuggestions();
    playAnswerUntilNext(true);
  }

  function closeResultModal(){
    if (!resultModal.classList.contains("show")) return;
    resultModal.classList.remove("show");
    submitBtn.disabled = false;
    submitBtn.textContent = "Next song";
    submitBtn.classList.remove("skip-mode");
    guessInput.disabled = true;
    resetSuggestions();
    if (audio){
      playbackMode = "answer";
      audio.loop = true;
      setPlayIcon(!audio.paused);
    }
  }

  function advanceAfterFailure(){
    if (over) return;
    if (levelIndex >= DURATIONS.length - 1){
      openResultModal(false);
      return;
    }
    const previousMark = DURATIONS[levelIndex];
    levelIndex += 1;
    guessInput.value = "";
    updateSubmitMode();
    resetSuggestions();
    setActiveMarker();
    playClipToLevel(previousMark);
  }

  function submitGuess(){
    if (over){
      if (!resultModal.classList.contains("show")){
        startRound();
      }
      return;
    }
    const text = guessInput.value.trim();
    if (!text){
      advanceAfterFailure();
      return;
    }
    if (isCorrectGuess(text, current)) openResultModal(true);
    else advanceAfterFailure();
  }

  function renderSuggestions(query){
    const q = normalize(query);
    if (!q){ resetSuggestions(); return; }
    const matches = pool
      .filter(song => normalize(song.name).includes(q) || normalize(song.artist).includes(q))
      .slice(0, 7);
    if (!matches.length){ resetSuggestions(); return; }

    suggestionsEl.innerHTML = "";
    matches.forEach(song => {
      const button = document.createElement("button");
      button.type = "button";
      const title = document.createElement("div");
      title.className = "title";
      title.textContent = song.name;
      const artist = document.createElement("div");
      artist.className = "artist";
      artist.textContent = song.artist;
      button.append(title, artist);
      button.addEventListener("click", () => {
        guessInput.value = song.name;
        resetSuggestions();
        updateSubmitMode();
        guessInput.focus();
      });
      suggestionsEl.appendChild(button);
    });
    activeSuggestionIndex = -1;
    suggestionsEl.style.display = "block";
  }

  playBtn.addEventListener("click", () => {
    if (!over) toggleClipPlayback();
  });

  guessForm.addEventListener("submit", event => {
    event.preventDefault();
    submitGuess();
  });

  guessInput.addEventListener("input", () => {
    updateSubmitMode();
    renderSuggestions(guessInput.value);
  });

  guessInput.addEventListener("keydown", event => {
    const items = Array.from(suggestionsEl.querySelectorAll("button"));
    if (event.key === "ArrowDown" && items.length){
      event.preventDefault();
      activeSuggestionIndex = Math.min(activeSuggestionIndex + 1, items.length - 1);
      items.forEach((item, index) => item.classList.toggle("active", index === activeSuggestionIndex));
    } else if (event.key === "ArrowUp" && items.length){
      event.preventDefault();
      activeSuggestionIndex = Math.max(activeSuggestionIndex - 1, 0);
      items.forEach((item, index) => item.classList.toggle("active", index === activeSuggestionIndex));
    } else if (event.key === "Enter" && activeSuggestionIndex >= 0 && items.length){
      event.preventDefault();
      const chosen = items[activeSuggestionIndex];
      chosen.click();
    } else if (event.key === "Escape"){
      resetSuggestions();
    }
  });

  document.addEventListener("click", event => {
    if (!guessForm.contains(event.target)) resetSuggestions();
  });

  volumeSlider.addEventListener("input", () => {
    currentVolume = Number(volumeSlider.value);
    if (audio) audio.volume = currentVolume;
  });

  nextBtn.addEventListener("click", () => {
    stopAudio();
    startRound();
  });
  modalClose.addEventListener("click", closeResultModal);
  retryBtn.addEventListener("click", boot);

  async function boot(){
    loadingState.style.display = "flex";
    errorState.style.display = "none";
    gameEl.style.display = "none";
    try{
      pool = await loadPool();
      if (pool.length < 10) throw new Error("not enough songs with previews");
      loadingState.style.display = "none";
      gameEl.style.display = "block";
      startRound();
    }catch(error){
      console.error(error);
      loadingState.style.display = "none";
      errorState.style.display = "flex";
    }
  }

  boot();
})();
</script>
</body>
</html>
